# Reckless Fathoms — entrée à ajouter au nginx de l'hôte.
#
# À poser dans /etc/nginx/sites-available/ (puis lier dans sites-enabled/),
# ou directement dans /etc/nginx/conf.d/.
#
# Le jeu tourne dans DEUX conteneurs Docker, qui n'écoutent que sur la boucle
# locale — rien n'est exposé par eux-mêmes :
#
#   rf-web            127.0.0.1:8899   sert les pages, et relaie le jeu
#   reckless-fathoms  127.0.0.1:8787   l'arbitre (parties, salles, dés)
#
# Ce bloc-ci n'a qu'à tout renvoyer sur 8899 : rf-web sait déjà distinguer une
# page d'une partie.
#
# ⚠ UNE SEULE SUBTILITÉ, et c'est celle qui casse en silence : le jeu ouvre une
# LIGNE PERMANENTE (WebSocket) vers la même adresse que les pages. Sans les
# en-têtes `Upgrade` et `Connection`, nginx la raccroche aussitôt — le joueur
# voit « Connexion au serveur impossible » et rien dans les journaux.

# ⚠ Si un `map $http_upgrade` existe déjà ailleurs dans la configuration,
# NE PAS le redéclarer ici : nginx refuserait de recharger.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name reckless-fathoms.mgl-studio.fr;

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les deux lignes qui comptent.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Une partie dure : on ne coupe pas une ligne inactive au bout d'une
        # minute, sinon le joueur qui réfléchit se fait déconnecter.
        proxy_read_timeout 3600s;
    }
}

# Ensuite, pour le HTTPS (Let's Encrypt réécrit ce fichier tout seul) :
#
#   sudo nginx -t                                        # vérifier AVANT
#   sudo systemctl reload nginx                          # recharger, pas redémarrer
#   sudo certbot --nginx -d reckless-fathoms.mgl-studio.fr
